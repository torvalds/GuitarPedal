#
# The radio stack is in every image, including the one built with
# CONFIG_BT=n, which does not call bt_enable() and never advertises.
#
# It is here from the start because it is the part most likely to stop
# building for a reason nobody notices: the board has no 32.768 kHz
# crystal, and the low-frequency clock that fact forces is exactly what
# Nordic's protocol timing layer - MPSL - refuses to start without.  A
# build that carries the stack proves that choice every time.
#
# Note that this is not inactive.  MPSL comes up from a SYS_INIT hook at
# PRE_KERNEL_1 priority 40, ahead of the UART driver at 50 and the
# console at 60, so it runs whether or not anything calls into
# Bluetooth - and if it refuses, it does so before there is any way to
# say so.  'make nobt' is the image to reach for when this one says
# nothing at all.
#
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="pedal"

#
# There is no console.  uart30 is the MIDI link to the RP2354, and a
# printk into it corrupts the message behind it: any byte with bit 7 set
# reads as a MIDI status byte.  Debugging over SWD is not the way out
# either, because reading the buffer stalls the core long enough to break
# what is being debugged.  So the radio says nothing until it can say it
# as MIDI, over uart30 with everything else.
#
# Two banner symbols: the nRF Connect SDK has one of its own and it is
# the one that prints.  It also selects PRINTK and EARLY_CONSOLE, so
# turning off Zephyr's alone leaves both compiled in.
#
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n

#
# The asynchronous UART API, because UARTE is EasyDMA and has no byte
# FIFO to service.  The interrupt-driven API emulates one on top of it
# and takes an interrupt per handful of bytes; this hands the driver
# whole buffers and takes one per buffer.
#
CONFIG_UART_ASYNC_API=y
CONFIG_RING_BUFFER=y

#
# One MIDI packet over Bluetooth is the negotiated MTU minus three, so
# at the default MTU of 23 it is 20 bytes and a 39 kB schema needs two
# thousand of them.  At 247 it is 244.  The ACL buffers carry the L2CAP
# header on top of that.
#
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

#
# What this radio asks the central for, advertised in the GAP
# characteristic every central reads.
#
# The BLE-MIDI specification asks for a connection interval of 15 ms or
# less and the lowest both ends support; 7.5 ms is the floor Bluetooth
# allows.  Stating a preference here rather than calling
# bt_conn_le_param_update() keeps it out of the connected callback.
#
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

#
# The radio is a central as well as a peripheral: the web app connects
# to it, and it connects to a foot controller.  A scan needs only the
# observer role; the central is for the connection to a controller the
# player has picked, which is not written yet.
#
# BT_MAX_CONN is split by BT_CTLR_SDC_PERIPHERAL_COUNT - what is left
# over is the number of central roles - so this is one of each, with a
# spare.
#
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1

#
# Bonds that outlive a reset.
#
# Without a settings backend the keys are in RAM, so a host that bonds and
# comes back after the radio has restarted offers a key the radio has
# forgotten - and the radio restarts whenever the pedal does, which is
# every time its power source changes.
#
# ZMS rather than NVS because this part stores in RRAM, which does not need
# erasing before a write and is what ZMS is for; the settings subsystem
# picks the backend from whichever is enabled.  The partition is already
# in the devicetree - 36 kB of 'storage' at 0xf4000 - so there is nothing
# to lay out.
#
# settings_load() has to be called after bt_enable(), and is, in
# midi_ble_start().
#
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_BT_SETTINGS=y

#
# Room for a footswitch and more than one host.  It was one, which a
# bonded footswitch took entirely, leaving a host nowhere to go.
#
# A full table overwrites the oldest key that is not in use rather than
# refusing the pairing, because refusing it says nothing to whoever is
# standing there holding the pedal.
#
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

#
# Pairing.  The controller hangs up during service discovery on a
# connection that was never asked to be encrypted.  It does not answer
# the request either, so nothing waits for a bond - asking is what keeps
# the link up long enough to subscribe.
#
CONFIG_BT_SMP=y

#
# Both of these are on by default in the nRF Connect SDK and both stop
# the pairing dead.
#
# The controller offers legacy pairing only - it answers a request with
# auth_req 0x01, no Secure Connections bit - so SC_PAIR_ONLY refuses it
# and the link drops half a second after the response arrives.  And the
# radio has no keypad and no display, so it can only ever do Just Works,
# which ENFORCE_MITM rules out by definition.
#
# What is left is unauthenticated legacy pairing, which is weak: it is
# open to an eavesdropper who is present while the two are paired.  That
# is the price of this particular footswitch.  The security that matters
# here is which device the pedal will take messages from at all, and
# that is a binding initiated over USB rather than anything SMP does.
#
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
