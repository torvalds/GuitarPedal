#
# The radio stack is in every image, including this one, which does not
# call bt_enable() and never advertises.
#
# It is here from the start because it is the part most likely to stop
# building for a reason nobody notices: the board has no 32.768 kHz
# crystal, and the low-frequency clock that fact forces is exactly what
# Nordic's protocol timing layer - MPSL - refuses to start without.  A
# build that carries the stack proves that choice every time.
#
# Note that this is not inactive.  MPSL comes up from a SYS_INIT hook at
# PRE_KERNEL_1 priority 40, ahead of the UART driver at 50 and the
# console at 60, so it runs whether or not anything calls into
# Bluetooth - and if it refuses, it does so before there is any way to
# say so.  'make nobt' is the image to reach for when this one says
# nothing at all.
#
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="pedal"
